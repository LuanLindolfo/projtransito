name: Auto Traffic Monitor

# Define os gatilhos (triggers) da automação
on:
  schedule:
    # A expressão cron abaixo roda o script no minuto 0 de cada hora.
    # Você pode ajustar no site crontab.guru se quiser outra frequência.
    - cron: '0 * * * *'
  
  # O workflow_dispatch permite que você aperte um botão "Run workflow" 
  # no GitHub para testar manualmente sem esperar o cron.
  workflow_dispatch: 

# Concede permissão de escrita ao bot do GitHub Actions
# Essencial para permitir o push das novas imagens e do CSV atualizado
permissions:
  contents: write

jobs:
  detect-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Faz cache das dependências para acelerar a execução

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Executar Pipeline de Visão Computacional e ETL
        run: python run_pipeline.py
        # Se você for usar uma câmera que exija autenticação ou API privada, 
        # é aqui que você mapeia os secrets do GitHub como variáveis de ambiente:
        # env:
        #   API_KEY: ${{ secrets.CAMERA_API_KEY }}

      - name: 🚀 Commit e Push Automático
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 bot: Atualização de métricas e imagens de tráfego"
          # Especifique os arquivos que o script Python vai gerar/modificar
          file_pattern: 'data/traffic_log.csv images/latest_detection.jpg images/chart.png README.md'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
